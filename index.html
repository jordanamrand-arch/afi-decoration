<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AFI Decoration — Sistem Operasional Dekorasi Wedding. Kelola booking, stok properti, arus kas, dan cetak invoice dalam satu platform.">
  <meta name="theme-color" content="#0f1a12">
  <title>AFI Decoration — Sistem Operasional Wedding</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="src/styles/variables.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/animations.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/sidebar.css">
  <link rel="stylesheet" href="src/styles/dashboard.css">
  <link rel="stylesheet" href="src/styles/booking.css">
  <link rel="stylesheet" href="src/styles/stok.css">
  <link rel="stylesheet" href="src/styles/kas.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Mobile Toggle -->
    <button class="sidebar__toggle" id="sidebar-toggle" aria-label="Toggle Navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- Mobile Overlay -->
    <div class="sidebar__overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <!-- Logo -->
      <div class="sidebar__logo">
        <div class="sidebar__logo-icon">A</div>
        <div class="sidebar__logo-text">
          <span class="sidebar__logo-name">AFI DECORATION</span>
          <span class="sidebar__logo-tagline">Wedding & Event</span>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="sidebar__nav">
        <div class="sidebar__section-label">Menu Utama</div>

        <div class="sidebar__item active" data-page="dashboard" id="nav-dashboard">
          <span class="sidebar__item-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
          </span>
          Dashboard
        </div>

        <div class="sidebar__item" data-page="booking" id="nav-booking">
          <span class="sidebar__item-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </span>
          Booking
          <span class="sidebar__item-badge" id="booking-badge">4</span>
        </div>

        <div class="sidebar__section-label">Manajemen</div>

        <div class="sidebar__item" data-page="stok" id="nav-stok">
          <span class="sidebar__item-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
              <line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
          </span>
          Manajemen Stok
        </div>

        <div class="sidebar__item" data-page="kas" id="nav-kas">
          <span class="sidebar__item-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
              <line x1="1" y1="10" x2="23" y2="10"/>
            </svg>
          </span>
          Arus Kas
        </div>
      </nav>

      <!-- Footer -->
      <div class="sidebar__footer">
        <div class="sidebar__db-status" id="db-status-container" title="Klik untuk menyinkronkan data">
          <span class="db-status-dot connecting" id="db-status-dot"></span>
          <span class="db-status-text" id="db-status-text">Menghubungkan basis data...</span>
        </div>
        <div class="sidebar__user">
          <div class="sidebar__avatar">AF</div>
          <div class="sidebar__user-info">
            <span class="sidebar__user-name">Admin AFI</span>
            <span class="sidebar__user-role">Owner</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <div class="page active" id="page-dashboard"></div>
      <div class="page" id="page-booking"></div>
      <div class="page" id="page-stok"></div>
      <div class="page" id="page-kas"></div>
    </main>
  </div>

  <!-- Scripts (order matters) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="src/js/data.js"></script>
  <script src="src/js/components.js"></script>
  <script src="src/js/dashboard.js"></script>
  <script src="src/js/booking.js"></script>
  <script src="src/js/stok.js"></script>
  <script src="src/js/kas.js"></script>
  <script src="src/js/invoice.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
